<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>服务费汇总与开票交互原型</title>
  <link rel="stylesheet" href="assets/prototype.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">原型导航</div>
    <div class="menu-title">商户平台</div>
    <a class="menu-item" href="merchant-settlement-query.html">结算单查询（试行）</a>
    <a class="menu-item" href="merchant-service-fee-summary.html">服务费汇总</a>
    <a class="menu-item" href="merchant-invoice.html">发票</a>
    <div class="menu-title">运营平台</div>
    <a class="menu-item" href="manage-settlement-query.html">结算单查询（试行）</a>
    <a class="menu-item" href="manage-service-fee-summary.html">服务费汇总</a>
    <a class="menu-item" href="manage-invoice.html">发票</a>
  </aside>
  <main class="main">
    <div class="topbar">
        <strong>商户服务费汇总与开票 - HTML 交互原型</strong>
      <span>静态页面，仅用于业务确认</span>
    </div>
    <div class="page">
      <div class="card">
        <div class="card-hd">页面范围</div>
        <div class="card-bd">
          <div class="steps">
            <div class="step active"><strong>1. 结算单查询</strong>选择服务费汇总方式并勾选结算单。</div>

            <div class="step active"><strong>4. 审核</strong>运营、财务初审、财务复审。</div>
            <div class="step active"><strong>5. 发票</strong>自动开票、查询结果、失败重开。</div>
          </div>
          <div class="hint">
            原型模拟现有 Vue2 + Element UI 后台风格。按钮弹窗为本地 JS 模拟，不包含真实接口。
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
